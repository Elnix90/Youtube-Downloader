# Configuration for YouTube Music Downloader


[paths]
# Main directories
json_dir = "JSON"
cred_dir = "CREDS" 
logs_dir = "LOGS"
config_dir = "CONFIG"

# Download paths and database
download_path = "~/YOUTUBE/MUSICS"
db_path = "music.db"

# Configuration files
client_secrets_file = "client_secret.json"
token_file = "token.json"
playlist_videos_file = "playlist_videos.json"
cookies_file = "cookies.txt



[patterns]
# Pattern files
unwanted_patterns_file = "unwanted_patterns.txt"
remix_patterns_file = "remix_patterns.txt"
private_patterns_file = "private_patterns.txt" 
trusted_artists_file = "trusted_artists.txt"

[processing]
# Main processing configuration

playlist_id = "LL"  # "LL" = liked videos
max_lyrics_retries = 1 # How many tries the programm do when sarching lyrics, before giving up. (if the music is a non-lyrics music, it'll try once, and then skip it)

use_sponsorblock = true # Whether to fetch sponsorblock api to cut segments in the song. segments are customizables in sponsorblock_categories
get_lyrics = true #  Whether to fetch lyrics using syncedlyrics
get_thumbnail = true # Download Youtube thumbnail
add_tags = true # Add auto tags based on the filters in CONFIG/TAGS
add_album = true
embed_metadata = true

force_recompute_lyrics = false
force_recompute_thumbnails = false
force_recompute_tags = true
force_recompute_album = true
force_update_date = true
force_update_metadata = true

thumbnail_format = "pad"  # "pad" or "crop"

sponsorblock_categories = ["music_offtopic", "sponsor", "intro", "outro"]

tag_separator = " ~ "
tag_start_delimiter = "["
tag_end_delimiter = "]"
tag_inner_separator = ","

add_entry_id_to_title = true
entry_id_separator = "---"
entry_id_size = 6

include_time_in_embedded_date = true

force_mp3_presence = false
force_recompute_yt_info = false

retry_unavailable = true
retry_private = false

info = true
error = true
test_run = false

get_remix_of = false
remix_confidence_threshold = 0.8
force_recompute_remix_of = false

clean = false
remove_no_longer_in_playlist = false
remove_malformatted = false
create_db_if_not = true
add_folder_files_not_in_list = true

[logging]
# Logging configuration

console_globally = true
level_console = "ERROR"  # VERBOSE, DEBUG, INFO, WARNING, ERROR, CRITICAL
level_logfiles = "VERBOSE"
log_yt_dlp_info = false # Log most of useful things yt-dlp says
log_yt_dlp_verbose = false # Log ALL what yt_dlp says
overlap_fprint = true # Display a clean output in console, by ovrelapping similar previous logs
overwrite_unchanged = true # Overwrite videos in the output if they haven't being touched by the programm (already downloaded and formatted)

[other]
# Some other stuff that isn't necessary

music_playlist_id = "PLnVyge3em-a2ElGZrft3LHoh64YnGhPsh" # The playlist ID not url (random letters after youtube.com/playlist?v=HERE <----)
clean = false
connect_google_at_start = false # If encountering bots walls or login prompts